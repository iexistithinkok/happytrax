<!DOCTYPE html>

<head>
<meta charset="UTF-8" />
<title>Happy Trax – Sugar Coast Playlist</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top, #0b0f21, #070707);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: white;
    }

    .glass-player {
        width: 90%;
        max-width: 520px;
        padding: 30px 26px 32px;
        border-radius: 22px;
        backdrop-filter: blur(25px);
        background: rgba(8, 8, 20, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow:
            0 0 40px rgba(0, 255, 255, 0.25),
            0 0 35px rgba(255, 0, 255, 0.18),
            inset 0 0 18px rgba(255, 255, 255, 0.05);
        text-align: center;
    }

    .title-main {
        font-size: 1.5rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin: 0 0 4px 0;
    }

    .title-sub {
        font-size: 0.85rem;
        opacity: 0.7;
        margin: 0 0 18px 0;
    }

    .controls-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 12px;
    }

    .ctrl-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid rgba(0, 247, 255, 0.7);
        background: radial-gradient(circle at 20% 20%, #2b1c3f, #050716);
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 18px;
        box-shadow: 0 0 16px rgba(0, 247, 255, 0.6);
        transition: transform 0.08s ease-out, box-shadow 0.1s ease-out, border-color 0.1s;
    }

    .ctrl-btn:hover {
        transform: translateY(-1px) scale(1.03);
        box-shadow:
            0 0 20px rgba(0, 247, 255, 0.9),
            0 0 24px rgba(255, 0, 255, 0.5);
        border-color: rgba(255, 0, 255, 0.9);
    }

    .ctrl-btn:active {
        transform: translateY(0) scale(0.97);
        box-shadow: 0 0 10px rgba(0, 247, 255, 0.5);
    }

    .ctrl-btn.play {
        width: 46px;
        height: 46px;
        font-size: 20px;
    }

    select {
        margin-top: 4px;
        width: 100%;
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(0, 255, 255, 0.4);
        color: white;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
        backdrop-filter: blur(8px);
        appearance: none;
    }

    select option {
        background: #050816;
        color: white;
    }

    select:focus {
        border-color: #00f7ff;
        box-shadow: 0 0 10px #00f7ff;
    }

    audio {
        width: 100%;
        margin-top: 14px;
    }

    .equalizer {
        margin-top: 22px;
        height: 40px;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 7px;
    }

    .bar {
        width: 7px;
        background: linear-gradient(180deg, #00f7ff, #ff00ff);
        border-radius: 4px;
        animation: bounce 1s infinite ease-in-out;
        box-shadow: 0 0 16px rgba(0, 255, 255, 0.8);
    }

    .bar:nth-child(1) { animation-delay: -0.4s; }
    .bar:nth-child(2) { animation-delay: -0.2s; }
    .bar:nth-child(3) { animation-delay: 0s; }
    .bar:nth-child(4) { animation-delay: -0.3s; }
    .bar:nth-child(5) { animation-delay: -0.1s; }

    @keyframes bounce {
        0%   { height: 9px; }
        40%  { height: 40px; }
        80%  { height: 18px; }
        100% { height: 9px; }
    }

    .now-playing {
        margin-top: 10px;
        font-size: 0.9rem;
        opacity: 0.8;
    }

    .now-playing span {
        font-weight: 600;
    }
</style>
</head>

<script>
const baseUrl = "https://airinsmusic.s3.us-east-2.amazonaws.com/Music/";

let playlist = document.getElementById("trackList");
let audio = document.getElementById("audioPlayer");
let nowPlayingText = document.getElementById("nowPlayingText");

audio.addEventListener("ended", function () {
    nextTrack();
});

function updateNowPlayingLabel() {
    const label = playlist.options[playlist.selectedIndex].text;
    nowPlayingText.textContent = label;
}

function changeTrack() {
    let rawFile = playlist.value;
    let encodedPath = encodeURIComponent(rawFile);
    audio.src = baseUrl + encodedPath;
    audio.load();
    audio.play();
    updateNowPlayingLabel();
}

function nextTrack() {
    let i = playlist.selectedIndex;
    i = (i + 1) % playlist.options.length;
    playlist.selectedIndex = i;
    changeTrack();
}

function prevTrack() {
    let i = playlist.selectedIndex;
    i = (i - 1 + playlist.options.length) % playlist.options.length;
    playlist.selectedIndex = i;
    changeTrack();
}

function togglePlay() {
    if (audio.paused) {
        audio.play();
    } else {
        audio.pause();
    }
}

// Initialize first track on load
changeTrack();
</script>
